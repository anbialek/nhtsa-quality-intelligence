version: 2

models:
  - name: silver_recall_campaign
    description: "One row per unique recall campaign. Contains campaign-level attributes: manufacturer, dates, summary, remedy, severity flags"
    columns:
      - name: campaign_number
        tests:
          - not_null
          - unique
      
      - name: manufacturer
        tests:
          - not_null
      
      - name: report_received_date
        tests:
          - not_null


  - name: silver_recall_affected_model
    description: "One row per unique complaint (odi_number). Includes VIN normalization, epoch date handling, filing lag calculation, and production cohort key extraction"
    columns:
      - name: campaign_number
        tests:
          - not_null
      
      - name: make
        tests:
          - not_null
      
      - name: model
        tests:
          - not_null
      
      - name: model_year
        tests:
          - not_null
      
  
  - name: silver_complaint
    description: "One row per (complaint, vehicle product). Exploded from nested products list, filtered to Vehicle type only"
    columns: 
      - name: odi_number
        tests: 
          - not_null
          - unique
      
      - name: manufacturer
        tests: 
          - not_null
          
      - name: date_complaint_filed
        tests:
          - not_null

  - name: silver_complaint_product
    description: "Silver model: NHTSA complaint details - product level. Casting, filtering by type (only Vehicle)"
    columns:
      - name: odi_number
        tests:
          - not_null
      
      - name: product_make
        tests:
          - not_null

      - name: product_model
        tests:
          - not_null

      - name: product_year
        tests:
          - not_null
